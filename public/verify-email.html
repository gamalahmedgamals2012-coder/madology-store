<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | MADOLOGY</title>
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="verify-email.css">
  <link rel="stylesheet" href="premium-ui.css">
  <link rel="shortcut icon" href="../ascets/images/logo.png" type="image/x-icon">
</head>

<body>
  <div id="uiToastContainer"></div>
  <div class="verify-wrapper">
    <div class="verify-card">
      <h2>Verify Your Email</h2>
      <p>
        We sent a 6-digit code to
        <span id="emailText" class="verify-email"></span>
      </p>
      <input type="text" id="verificationCode" placeholder="000000" maxlength="6" inputmode="numeric">
      <button id="verifyBtn">Verify Code</button>
      <button id="resendBtn" type="button">Resend Code</button>
      <p id="statusMessage" class="verify-status" aria-live="polite"></p>
      <p class="account-login">Already verified? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="ui-feedback.js"></script>
  <script src="verify-email.js"></script>
</body>

</html>
