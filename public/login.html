<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MADOLOGY</title>
    <script src="api-config.js"></script>
    <link rel="stylesheet" href="login.css">

    <link rel="shortcut icon" href="../ascets/images/logo.png" type="image/x-icon">

</head>

<body>
    <div id="uiToastContainer"></div>
    <div class="auth-card">
        <div class="auth-form">

        </div>
    </div>
    <script src="ui-feedback.js"></script>
    <script src="login.js"></script>

</html>
