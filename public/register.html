<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MADOLOGY</title>
    <script src="api-config.js"></script>
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="premium-ui.css">
  <link rel="shortcut icon" href="../ascets/images/logo.png" type="image/x-icon">

</head>

<body>
  <div id="uiToastContainer"></div>
  <div class="auth-card">
    <div class="auth-form">
      <h2>Sign Up</h2>

      <input type="text" id="email" placeholder="Email">
      <input type="text" id="name" placeholder="Full Name">
      <input type="tel" id="phone" placeholder="Phone Number">
      <input type="text" id="addressSearch" placeholder="Search your address">
      <div id="addressSearchResults" class="address-search-results" hidden></div>
      <div id="addressMap" class="address-map" aria-label="Address map"></div>
      <p id="addressStatus" class="address-status" aria-live="polite"></p>
      <input type="text" id="address" placeholder="Selected Address" readonly>
      <input type="hidden" id="latitude">
      <input type="hidden" id="longitude">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button id="registerBtn">Register</button>
    <p class="account-login">Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="ui-feedback.js"></script>
  <script src="register-map.js"></script>
  <script src="register.js"></script>
</body>

</html>
