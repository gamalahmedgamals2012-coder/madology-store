<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MADOLOGY</title>
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="premium-ui.css">
  <link rel="shortcut icon" href="../ascets/images/logo.png" type="image/x-icon">

</head>

<body>
  <div class="sign-up">
    <div class="form">
      <h2>Sign Up</h2>

      <input type="text" id="email" placeholder="Email">
      <input type="text" id="name" placeholder="Full Name">
      <input type="tel" id="phone" placeholder="Phone Number">
      <input type="text" id="addressSearch" placeholder="Search your address">
      <div id="addressMap" class="address-map" aria-label="Address map"></div>
      <input type="text" id="address" placeholder="Selected Address" readonly>
      <input type="hidden" id="latitude">
      <input type="hidden" id="longitude">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button id="registerBtn">Register</button>
    <p class="account-login">Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script>
    window.MADOLOGY_GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";
  </script>
  <script src="register-map.js"></script>
  <script src="register.js"></script>
</body>

</html>
